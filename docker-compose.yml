services:
  mysql:
    image: mysql:8.4
    container_name: cv-generator-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: cv_generator
      MYSQL_ROOT_PASSWORD: postgres
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ppostgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: cv-generator-phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:

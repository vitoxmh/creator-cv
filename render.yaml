services:
  - type: web
    name: cv-generator
    runtime: node
    plan: free
    buildCommand: npm install && npm install --prefix server && npm install --prefix client && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    postDeployCommand: npm run db:deploy
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cv-generator-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        sync: false

databases:
  - name: cv-generator-db
    plan: free
